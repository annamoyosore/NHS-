<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Portal</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:#f4f4f4;
            padding:50px;

        .container{
            max-width:600px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);

            border-radius:5px;

        }
        .pay{

<div class="container">
    <h1>Application Portal</h1>
    <p>Please choose one of the options below.</p>

    <a href="application-form.html" class="btn apply">

    </a>

        Make Payment
    </a>
</div>

</html>
